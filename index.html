<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090d">
<title>TV BOX</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
  background:#08090d;
  color:#fff;
  min-height:100vh
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#0d0f15;
  border-bottom:1px solid #20232d;
  padding:14px 18px
}

.header{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}

.logo{
  font-size:23px;
  font-weight:800
}

.search{
  flex:1;
  max-width:420px
}

.search input{
  width:100%;
  background:#171a22;
  border:1px solid #292d38;
  color:#fff;
  padding:11px 15px;
  border-radius:25px;
  outline:none
}

.categories{
  max-width:1200px;
  margin:18px auto;
  padding:0 18px;
  display:flex;
  gap:10px;
  overflow-x:auto
}

.categories button{
  flex:none;
  border:0;
  background:#171a22;
  color:#ddd;
  padding:10px 16px;
  border-radius:20px;
  cursor:pointer
}

.categories button.active{
  background:#fff;
  color:#000
}

.player-section{
  max-width:1200px;
  margin:auto;
  padding:0 18px 25px
}

.player{
  background:#000;
  border-radius:14px;
  overflow:hidden;
  border:1px solid #20232d;
  aspect-ratio:16/9;
  position:relative
}

.player iframe{
  width:100%;
  height:100%;
  border:0;
  display:none
}

.player-message{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  color:#999;
  padding:20px
}

.player-message h2{
  color:#fff;
  margin-bottom:8px
}

.container{
  max-width:1200px;
  margin:auto;
  padding:0 18px 40px
}

.section-title{
  font-size:20px;
  margin-bottom:15px
}

.channels{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px
}

.channel{
  background:#11131a;
  border:1px solid #20232d;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s
}

.channel:hover{
  transform:translateY(-3px);
  border-color:#666
}

.channel-logo{
  height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#181b23;
  font-size:26px;
  font-weight:800
}

.channel-info{
  padding:12px
}

.channel-name{
  font-weight:700;
  margin-bottom:5px
}

.channel-category{
  color:#888;
  font-size:12px
}

.live{
  display:inline-block;
  margin-top:8px;
  font-size:11px;
  padding:4px 7px;
  border-radius:5px;
  background:#272b35;
  color:#ddd
}

footer{
  text-align:center;
  color:#555;
  border-top:1px solid #20232d;
  padding:25px
}

@media(max-width:600px){

  .header{
    flex-wrap:wrap
  }

  .logo{
    font-size:20px
  }

  .search{
    order:3;
    flex-basis:100%;
    max-width:none
  }

  .channels{
    grid-template-columns:repeat(2,1fr);
    gap:10px
  }

  .channel-logo{
    height:85px;
    font-size:22px
  }

  .channel-info{
    padding:10px
  }
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">TV BOX</div>

<div class="search">
<input
id="searchInput"
type="text"
placeholder="Search channel..."
oninput="searchChannels()">
</div>

</div>
</header>


<div class="categories">

<button class="active"
onclick="filterCategory('All',this)">
All
</button>

<button onclick="filterCategory('Bengali News',this)">
বাংলা News
</button>

<button onclick="filterCategory('Hindi News',this)">
Hindi News
</button>

<button onclick="filterCategory('Music',this)">
Music
</button>

<button onclick="filterCategory('Movies',this)">
Movies
</button>

<button onclick="filterCategory('Parliament',this)">
Parliament
</button>

</div>


<section class="player-section">

<div class="player">

<iframe
id="liveFrame"
allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
allowfullscreen>
</iframe>

<div class="player-message" id="playerMessage">

<h2>▶ Select a channel</h2>

<p>
Select a live channel below.
</p>

</div>

</div>

</section>


<main class="container">

<h2 class="section-title">
Live Channels
</h2>

<div class="channels" id="channelList"></div>

</main>


<footer>
TV BOX
</footer>


<script>

const channels = [

/* DD NEWS - OFFICIAL VERIFIED YOUTUBE LIVE */

{
 name:"DD News",
 category:"Hindi News",
 logo:"DD",
 type:"youtube",
 id:"9bTteEYoX6I"
},

/* SANSAD TV */

{
 name:"Sansad TV 1",
 category:"Parliament",
 logo:"STV 1",
 type:"youtube",
 id:"wk7y95hcLpo"
},

/*
  Sansad TV 2
  Official website player is available,
  but we are not guessing a YouTube ID.
*/

{
 name:"Sansad TV 2",
 category:"Parliament",
 logo:"STV 2",
 type:"official",
 url:"https://sansadtv.nic.in/live-tv"
},

/* PLACEHOLDERS FOR NEXT STAGE */

{
 name:"DD Bangla",
 category:"Bengali News",
 logo:"DD বাংলা",
 type:"official",
 url:"https://prasarbharati.gov.in/live-tv/"
},

{
 name:"DD National",
 category:"Movies",
 logo:"DD",
 type:"official",
 url:"https://prasarbharati.gov.in/live-tv/"
},

{
 name:"DD India",
 category:"Hindi News",
 logo:"DD INDIA",
 type:"official",
 url:"https://prasarbharati.gov.in/live-tv/"
},

{
 name:"ABP Ananda",
 category:"Bengali News",
 logo:"ABP",
 type:"official",
 url:"https://bengali.abplive.com/live-tv"
},

{
 name:"TV9 Bangla",
 category:"Bengali News",
 logo:"TV9",
 type:"official",
 url:"https://tv9bangla.com/live-tv"
},

{
 name:"9XM",
 category:"Music",
 logo:"9XM",
 type:"official",
 url:"https://9xm.tv/"
},

{
 name:"B4U Music",
 category:"Music",
 logo:"B4U",
 type:"official",
 url:"https://b4uentertainment.com/"
},

{
 name:"B4U Movies",
 category:"Movies",
 logo:"B4U",
 type:"official",
 url:"https://b4uentertainment.com/"
}

];


let selectedCategory="All";


function displayChannels(list){

const container=document.getElementById("channelList");

container.innerHTML="";

list.forEach(channel=>{

const card=document.createElement("div");

card.className="channel";

card.innerHTML=`

<div class="channel-logo">
${channel.logo}
</div>

<div class="channel-info">

<div class="channel-name">
${channel.name}
</div>

<div class="channel-category">
${channel.category}
</div>

<span class="live">
● LIVE
</span>

</div>

`;

card.onclick=()=>playChannel(channel);

container.appendChild(card);

});

}


function playChannel(channel){

const frame=document.getElementById("liveFrame");
const message=document.getElementById("playerMessage");

message.style.display="none";
frame.style.display="block";

/* YouTube official live */

if(channel.type==="youtube"){

frame.src=
"https://www.youtube.com/embed/"
+channel.id+
"?autoplay=1&rel=0";

return;

}


/* Official website */

if(channel.type==="official"){

frame.src=channel.url;

return;

}

}


function filterCategory(category,button){

selectedCategory=category;

document
.querySelectorAll(".categories button")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

searchChannels();

}


function searchChannels(){

const text=document
.getElementById("searchInput")
.value
.toLowerCase()
.trim();

const result=channels.filter(channel=>{

const categoryMatch=
selectedCategory==="All" ||
channel.category===selectedCategory;

const searchMatch=
channel.name.toLowerCase().includes(text);

return categoryMatch && searchMatch;

});

displayChannels(result);

}


displayChannels(channels);

</script>

</body>
</html>
